name: Frontend Deploy QA
on:
  push:
    branches: [ "qa" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            BUILD_CMD=build:qa
            VITE_API_URL=https://carastani-qa.duckdns.org/api/v1
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/carastani-frontend:qa
            ${{ secrets.DOCKER_USERNAME }}/carastani-frontend:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo yum update -y
              sudo yum install -y docker
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ec2-user
            fi

            # Make sure Docker is running
            sudo systemctl start docker

            # Pull latest image
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/carastani-frontend:qa

            # Stop and remove old container
            sudo docker stop carastani-frontend-qa || true
            sudo docker rm carastani-frontend-qa || true

            # Start new container
            sudo docker run -d \
              --name carastani-frontend-qa \
              --restart always \
              -p 3000:80 \
              ${{ secrets.DOCKER_USERNAME }}/carastani-frontend:qa

            # Verify container is running
            sudo docker ps | grep carastani-frontend-qa
            echo "Frontend deployed successfully!"
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" fill="none">
  <!-- Shadow -->
  <ellipse cx="200" cy="132" rx="150" ry="6" fill="rgba(0,0,0,0.12)" />

  <!-- Rear diffuser / underbody -->
  <path d="M30 115 L370 115 L365 120 L35 120 Z" fill="#8B1A00" />

  <!-- Main body - ultra-low aggressive wedge -->
  <path d="M18 108 L28 88 L48 72 L80 55 L120 42 L180 34 L260 30 L320 32 L350 40 L368 52 L378 70 L384 90 L386 108 Z" fill="url(#bodyGrad)" />

  <!-- Lower body panel -->
  <path d="M18 108 L386 108 L384 115 L20 115 Z" fill="#A82000" />

  <!-- Roof panel - very flat -->
  <path d="M140 55 L158 42 L240 34 L280 34 L310 40 L340 55 Z" fill="#C43000" />

  <!-- Windshield - very raked angle -->
  <path d="M145 54 L164 42 L236 36 L270 36 L298 40 L330 54 Z" fill="#1a1a2e" />
  <path d="M145 54 L164 42 L236 36 L270 36 L298 40 L330 54 Z" fill="url(#windshieldGrad)" opacity="0.3" />

  <!-- Rear window -->
  <path d="M335 54 L318 42 L308 42 L326 54 Z" fill="#1a1a2e" opacity="0.8" />

  <!-- Front hood lines -->
  <line x1="260" y1="38" x2="370" y2="58" stroke="#B82800" stroke-width="0.8" opacity="0.6" />
  <line x1="240" y1="40" x2="365" y2="65" stroke="#B82800" stroke-width="0.5" opacity="0.4" />

  <!-- Rear engine cover vents -->
  <rect x="80" y="60" width="35" height="2.5" rx="1" fill="#8B1A00" opacity="0.7" />
  <rect x="82" y="65" width="30" height="2" rx="1" fill="#8B1A00" opacity="0.5" />

  <!-- Side air intake (large triangular) -->
  <path d="M160 80 L195 58 L210 58 L185 80 Z" fill="#7A1500" />
  <path d="M165 80 L195 62 L205 62 L180 80 Z" fill="#1a1a1a" opacity="0.6" />

  <!-- Side body crease / character line -->
  <path d="M40 95 L380 85 L378 88 L38 98 Z" fill="#D44000" opacity="0.4" />

  <!-- Side skirt -->
  <path d="M55 108 L345 108 L348 112 L52 112 Z" fill="#921C00" />

  <!-- Door panel line -->
  <line x1="220" y1="55" x2="218" y2="106" stroke="#A52800" stroke-width="0.8" />

  <!-- Door handle -->
  <rect x="230" y="75" width="10" height="2.5" rx="1.25" fill="#A52800" />

  <!-- Side mirror -->
  <path d="M325 53 L338 50 L338 56 L328 56 Z" fill="#B83000" />

  <!-- Headlights - Y-shaped Lambo signature -->
  <path d="M370 68 L386 74 L386 82 L374 78 Z" fill="#FDE68A" />
  <path d="M365 62 L380 68 L374 72 L362 66 Z" fill="#FCD34D" opacity="0.8" />
  <line x1="358" y1="58" x2="386" y2="70" stroke="#FDE68A" stroke-width="1.5" opacity="0.9" />
  <!-- Headlight glow -->
  <circle cx="386" cy="76" r="18" fill="url(#headGlow)" opacity="0.3" />

  <!-- Taillights - thin strip -->
  <path d="M18 92 L30 85 L30 100 L18 105 Z" fill="#DC2626" />
  <line x1="18" y1="96" x2="35" y2="90" stroke="#EF4444" stroke-width="2" opacity="0.9" />

  <!-- Front splitter -->
  <path d="M355 108 L390 105 L395 110 L360 112 Z" fill="#7A1500" />

  <!-- Rear spoiler -->
  <path d="M12 88 L6 84 L20 82 L25 88 Z" fill="#8B1A00" />

  <!-- Rear diffuser fins -->
  <rect x="25" y="110" width="3" height="5" rx="0.5" fill="#1a1a1a" />
  <rect x="32" y="110" width="3" height="5" rx="0.5" fill="#1a1a1a" />
  <rect x="39" y="110" width="3" height="5" rx="0.5" fill="#1a1a1a" />
  <rect x="46" y="110" width="3" height="5" rx="0.5" fill="#1a1a1a" />

  <!-- Exhaust tips -->
  <circle cx="22" cy="108" r="4" fill="#222" />
  <circle cx="22" cy="108" r="2.5" fill="#444" />
  <circle cx="34" cy="108" r="4" fill="#222" />
  <circle cx="34" cy="108" r="2.5" fill="#444" />

  <!-- Front wheel -->
  <g>
    <circle cx="320" cy="112" r="22" fill="#111" />
    <circle cx="320" cy="112" r="19" fill="#1a1a1a" />
    <!-- 5-petal Lambo rim -->
    <circle cx="320" cy="112" r="15" fill="none" stroke="#333" stroke-width="2" />
    <path d="M320 95 L325 107 L320 112 L315 107 Z" fill="#2a2a2a" />
    <path d="M336 104 L325 112 L320 112 L326 105 Z" fill="#2a2a2a" />
    <path d="M333 125 L324 116 L320 112 L327 115 Z" fill="#2a2a2a" />
    <path d="M307 125 L316 116 L320 112 L313 115 Z" fill="#2a2a2a" />
    <path d="M304 104 L315 112 L320 112 L314 105 Z" fill="#2a2a2a" />
    <circle cx="320" cy="112" r="6" fill="#333" />
    <circle cx="320" cy="112" r="3" fill="#F97316" />
    <!-- Tire tread -->
    <circle cx="320" cy="112" r="21" fill="none" stroke="#222" stroke-width="2" />
  </g>

  <!-- Rear wheel -->
  <g>
    <circle cx="80" cy="112" r="22" fill="#111" />
    <circle cx="80" cy="112" r="19" fill="#1a1a1a" />
    <circle cx="80" cy="112" r="15" fill="none" stroke="#333" stroke-width="2" />
    <path d="M80 95 L85 107 L80 112 L75 107 Z" fill="#2a2a2a" />
    <path d="M96 104 L85 112 L80 112 L86 105 Z" fill="#2a2a2a" />
    <path d="M93 125 L84 116 L80 112 L87 115 Z" fill="#2a2a2a" />
    <path d="M67 125 L76 116 L80 112 L73 115 Z" fill="#2a2a2a" />
    <path d="M64 104 L75 112 L80 112 L74 105 Z" fill="#2a2a2a" />
    <circle cx="80" cy="112" r="6" fill="#333" />
    <circle cx="80" cy="112" r="3" fill="#F97316" />
    <circle cx="80" cy="112" r="21" fill="none" stroke="#222" stroke-width="2" />
  </g>

  <!-- Wheel arches -->
  <path d="M55 108 Q80 82 105 108" fill="none" stroke="#921C00" stroke-width="2.5" />
  <path d="M295 108 Q320 82 345 108" fill="none" stroke="#921C00" stroke-width="2.5" />

  <defs>
    <linearGradient id="bodyGrad" x1="200" y1="30" x2="200" y2="115">
      <stop offset="0%" stop-color="#E84420" />
      <stop offset="35%" stop-color="#D43A18" />
      <stop offset="70%" stop-color="#C43010" />
      <stop offset="100%" stop-color="#A82000" />
    </linearGradient>
    <linearGradient id="windshieldGrad" x1="240" y1="34" x2="240" y2="55">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
    <radialGradient id="headGlow">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
  </defs>
</svg>
